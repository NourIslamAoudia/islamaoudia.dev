<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="code.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
    <title>Portfolio Admin | Nour Islam Aoudia</title>
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <a class="admin-back" href="index.html">
            <i class="bx bx-arrow-back"></i>
            Portfolio
          </a>
          <h1>Portfolio Islam</h1>
        </div>
        <button
          class="admin-button admin-button--ghost"
          id="sign-out"
          type="button"
          hidden
        >
          Sign out
        </button>
      </header>

      <p class="admin-status" id="admin-status" data-type="info">
        Loading admin...
      </p>

      <section class="admin-card" id="auth-panel">
        <h2>Sign in</h2>
        <form class="admin-form" id="auth-form">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="admin-button" type="submit">Sign in</button>
        </form>
      </section>

      <section class="admin-grid admin-stack" id="admin-panel" hidden>
        <section class="admin-card admin-project-browser">
          <div class="admin-card__header">
            <div>
              <h2>All projects</h2>
              <p>Projects are grouped by type. Choose one to edit its details.</p>
            </div>
            <button
              class="admin-button"
              id="new-project"
              type="button"
            >
              Add project
            </button>
          </div>
          <label class="admin-search">
            Search by project name
            <input
              id="project-search"
              type="search"
              placeholder="Search LAMSA, WordPress, API..."
            />
          </label>
          <div class="admin-projects" id="projects-list"></div>
        </section>

        <form class="admin-card admin-form admin-editor" id="project-form">
          <h2 id="editor-title">Project content</h2>

          <label>
            Title (English / default)
            <input name="title" type="text" required />
          </label>

          <label>
            Slug
            <input name="slug" type="text" placeholder="lamsa" />
          </label>

          <label>
            Description (English / default)
            <textarea name="description" rows="5" required></textarea>
          </label>

          <label>
            Detail title (English / default)
            <input name="detail_title" type="text" />
          </label>

          <label>
            Detail text (English / default)
            <textarea name="detail_body" rows="8"></textarea>
          </label>

          <div class="admin-language-group">
            <h3>French content</h3>
            <label>
              Title FR
              <input name="title_fr" type="text" />
            </label>
            <label>
              Description FR
              <textarea name="description_fr" rows="4"></textarea>
            </label>
            <label>
              Detail title FR
              <input name="detail_title_fr" type="text" />
            </label>
            <label>
              Detail text FR
              <textarea name="detail_body_fr" rows="6"></textarea>
            </label>
          </div>

          <div class="admin-language-group">
            <h3>Italian content</h3>
            <label>
              Title IT
              <input name="title_it" type="text" />
            </label>
            <label>
              Description IT
              <textarea name="description_it" rows="4"></textarea>
            </label>
            <label>
              Detail title IT
              <input name="detail_title_it" type="text" />
            </label>
            <label>
              Detail text IT
              <textarea name="detail_body_it" rows="6"></textarea>
            </label>
          </div>

          <div class="admin-form__row">
            <label>
              Type
              <select name="type">
                <option value="api">API's - Backend</option>
                <option value="cybersecurity">Cybersecurity</option>
                <option value="fullstack">Full Stack</option>
                <option value="wordpress">WordPress</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>
              Sort order
              <input name="sort_order" type="number" value="100" />
            </label>
          </div>

          <label>
            Photo link
            <input
              name="image_url"
              type="text"
              placeholder="https://... or project/image.png"
            />
          </label>

          <label>
            Upload photo
            <input
              name="image_file"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            />
          </label>

          <label>
            Upload gallery photos
            <input
              name="gallery_files"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
              multiple
            />
          </label>

          <label>
            Gallery photo format
            <select name="gallery_image_type">
              <option value="desktop">Desktop / wide screenshot</option>
              <option value="phone">Phone / mobile screenshot</option>
            </select>
          </label>

          <div class="admin-gallery-manager" id="gallery-manager" hidden>
            <h3>Project gallery</h3>
            <div class="admin-gallery-list" id="gallery-list"></div>
          </div>

          <label>
            Technologies
            <input
              name="tech_stack"
              type="text"
              placeholder="Django, FastAPI, Supabase"
            />
          </label>

          <div class="admin-form__row">
            <label>
              Demo link
              <input name="demo_url" type="url" />
            </label>
            <label>
              Documentation link
              <input name="documentation_url" type="url" />
            </label>
          </div>

          <div class="admin-form__row">
            <label>
              Source code link
              <input name="source_url" type="url" />
            </label>
            <label>
              API test link
              <input name="api_url" type="url" />
            </label>
          </div>

          <div class="admin-form__row">
            <label>
              Canva link
              <input name="canva_url" type="url" />
            </label>
            <label>
              Video link
              <input name="video_url" type="url" />
            </label>
          </div>

          <div class="admin-switches">
            <label>
              <input name="is_published" type="checkbox" checked />
              Afficher sur le site
            </label>
            <label>
              <input name="is_featured" type="checkbox" />
              Featured
            </label>
            <label>
              <input name="show_details" type="checkbox" />
              Afficher Plus d'info
            </label>
          </div>

          <div class="admin-actions">
            <button class="admin-button" id="project-submit" type="submit">
              Add project
            </button>
            <button
              class="admin-button admin-button--ghost"
              id="project-cancel"
              type="button"
              hidden
            >
              Cancel
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
